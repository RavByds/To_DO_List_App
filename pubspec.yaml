name: study_task
description: "A student-focused to-do list app."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.7

dependencies:
  flutter:
    sdk: flutter
  flutter_local_notifications: ^23.0.2
  flutter_timezone: ^5.1.1
  intl: ^0.20.2
  path: ^1.9.1
  sqflite: ^2.4.2
  timezone: ^0.11.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true

flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/study_task_icon.png
  min_sdk_android: 21
  remove_alpha_ios: true
